name: Release on main push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 2.0

jobs:
  build-native:
    name: Native (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: IMEAura-windows-x64
            preset: windows-msvc
            config: Release
          - os: ubuntu-latest
            artifact_name: IMEAura-linux-x64
            preset: linux-ninja
            config: Release
          - os: macos-latest
            artifact_name: IMEAura-macos-arm64
            preset: macos-clang
            config: Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libwayland-dev wayland-protocols libdbus-1-dev libatspi2.0-dev libgtk-4-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build/windows-msvc -C Release --output-on-failure

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build/linux-ninja --output-on-failure

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build/macos-clang --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "build/windows-msvc/src/Release"
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, img/icon.ico -Destination $bin
          Compress-Archive -Path "$bin/*" -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/IMEAura
          cp build/linux-ninja/src/IMEAura LICENSE THIRD_PARTY_NOTICES.md img/icon.ico dist/IMEAura/
          (cd dist/IMEAura && zip -r "../../${{ matrix.artifact_name }}.zip" .)

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/IMEAura.app/Contents/MacOS
          cp build/macos-clang/src/IMEAura dist/IMEAura.app/Contents/MacOS/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/IMEAura.app/Contents/
          ditto -c -k --keepParent dist/IMEAura.app "${{ matrix.artifact_name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - id: release
        run: echo "tag=v${APP_VERSION}.build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: IME Aura ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*.zip
